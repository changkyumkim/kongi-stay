name: 사이트 굽기

on:
  # hotels.json 을 고치면 바로 다시 굽는다
  push:
    branches: [main]
    paths:
      - 'hotels.json'
      - 'build.py'
      - '.github/workflows/build.yml'
  # (월요일 예약 실행은 2026-11 아고다 제휴 종료로 뺐다)
  # 버튼으로 직접 실행
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 부품 설치
        run: pip install requests

      - name: 굽기
        run: python build.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "바뀐 게 없습니다."
          else
            git commit -m "chore: 사이트 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
